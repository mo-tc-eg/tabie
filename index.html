<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تابع</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<style>
:root{
  --blue:#2563EB;--blue-light:#3B82F6;--blue-dark:#1D4ED8;
  --blue-xlight:#EFF6FF;--blue-glass:rgba(37,99,235,0.08);
  --white:#FFFFFF;--gray-50:#F8FAFC;--gray-100:#F1F5F9;
  --gray-200:#E2E8F0;--gray-300:#CBD5E1;--gray-400:#94A3B8;
  --gray-500:#64748B;--gray-700:#334155;--gray-900:#0F172A;
  --success:#10B981;--warning:#F59E0B;--danger:#EF4444;
  --surface:rgba(255,255,255,0.82);--surface2:rgba(255,255,255,0.55);
  --border:rgba(37,99,235,0.1);
  --sh-sm:0 2px 8px rgba(37,99,235,0.07);
  --sh-md:0 6px 20px rgba(37,99,235,0.1);
  --sh-lg:0 12px 40px rgba(37,99,235,0.14);
  --r-sm:12px;--r-md:16px;--r-lg:20px;--r-xl:24px;--nav:68px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:'Cairo',sans-serif;color:var(--gray-900);}
body{background:linear-gradient(160deg,#EFF6FF 0%,#DBEAFE 40%,#EEF2FF 100%);position:relative;}
body::before{content:'';position:fixed;top:-25%;right:-15%;width:60vw;height:60vw;background:radial-gradient(circle,rgba(37,99,235,0.1) 0%,transparent 65%);pointer-events:none;z-index:0;}
body::after{content:'';position:fixed;bottom:-15%;left:-10%;width:50vw;height:50vw;background:radial-gradient(circle,rgba(59,130,246,0.07) 0%,transparent 65%);pointer-events:none;z-index:0;}
#app{position:fixed;inset:0;z-index:1;overflow:hidden;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;opacity:0;transform:translateX(18px);transition:opacity .3s cubic-bezier(.4,0,.2,1),transform .3s cubic-bezier(.4,0,.2,1);}
.screen.active{display:flex;opacity:1;transform:translateX(0);}
.screen.leaving{display:flex;opacity:0;transform:translateX(-18px);pointer-events:none;}
.glass{background:var(--surface);backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);border:1px solid rgba(255,255,255,0.7);box-shadow:var(--sh-md);}
.glass2{background:var(--surface2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.55);box-shadow:var(--sh-sm);}
.page-scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.page-scroll::-webkit-scrollbar{display:none;}
.ph{padding:14px 18px 10px;background:rgba(255,255,255,0.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(37,99,235,0.08);flex-shrink:0;position:sticky;top:0;z-index:10;}
.ph h1{font-size:21px;font-weight:800;color:var(--gray-900);letter-spacing:-.4px;}
.ph p{font-size:12px;color:var(--gray-400);margin-top:1px;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav);background:rgba(255,255,255,0.93);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid rgba(37,99,235,0.08);box-shadow:0 -2px 16px rgba(37,99,235,0.08);display:flex;align-items:center;justify-content:space-around;padding:0 2px;z-index:100;}
.ni{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:1;height:100%;cursor:pointer;border:none;background:none;outline:none;transition:all .2s;position:relative;}
.ni .material-icons-round{font-size:21px;color:var(--gray-300);transition:all .25s cubic-bezier(.4,0,.2,1);}
.ni .lbl{font-size:9px;font-weight:600;color:var(--gray-300);transition:all .25s;font-family:'Cairo',sans-serif;}
.ni.active .material-icons-round{color:var(--blue);transform:translateY(-1px) scale(1.08);}
.ni.active .lbl{color:var(--blue);}
.ni.active::after{content:'';position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--blue);animation:ndot .25s ease;}
@keyframes ndot{from{transform:scale(0);opacity:0;}to{transform:scale(1);opacity:1;}}
.card{border-radius:var(--r-lg);padding:16px;margin-bottom:10px;}
.cardsm{border-radius:var(--r-md);padding:12px 14px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700;transition:all .18s cubic-bezier(.4,0,.2,1);outline:none;}
.btn-p{background:linear-gradient(135deg,var(--blue-light),var(--blue-dark));color:white;border-radius:var(--r-sm);padding:13px 22px;font-size:14px;box-shadow:0 4px 14px rgba(37,99,235,0.28);}
.btn-p:active{transform:scale(.97);box-shadow:0 2px 6px rgba(37,99,235,0.18);}
.btn-ghost{background:var(--blue-glass);color:var(--blue);border-radius:var(--r-sm);padding:9px 16px;font-size:12px;}
.btn-icon{width:36px;height:36px;border-radius:10px;background:var(--blue-glass);color:var(--blue);}
.btn-del{width:36px;height:36px;border-radius:10px;background:rgba(239,68,68,.08);color:var(--danger);}
.btn-ok{width:36px;height:36px;border-radius:10px;background:rgba(16,185,129,.08);color:var(--success);}
.btn-fail{width:36px;height:36px;border-radius:10px;background:rgba(239,68,68,.08);color:var(--danger);}
.btn-warn{background:rgba(245,158,11,.1);color:#D97706;border-radius:var(--r-sm);padding:9px 16px;font-size:12px;}
.badge{display:inline-flex;align-items:center;justify-content:center;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;font-family:'Cairo',sans-serif;}
.bdg-s{background:rgba(16,185,129,.1);color:#059669;}
.bdg-w{background:rgba(245,158,11,.1);color:#D97706;}
.bdg-d{background:rgba(239,68,68,.1);color:#DC2626;}
.bdg-b{background:rgba(37,99,235,.1);color:var(--blue);}
.bdg-g{background:var(--gray-100);color:var(--gray-500);}
.pb{height:5px;background:rgba(37,99,235,.08);border-radius:3px;overflow:hidden;}
.pf{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blue-light),var(--blue-dark));transition:width 1.1s cubic-bezier(.4,0,.2,1);}
.sec{font-size:11px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;padding:0 2px;}
.fab{position:fixed;bottom:calc(var(--nav)+14px);left:18px;width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--blue-light),var(--blue-dark));color:white;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(37,99,235,.35);cursor:pointer;border:none;transition:all .2s cubic-bezier(.4,0,.2,1);z-index:90;}
.fab:active{transform:scale(.92);box-shadow:0 3px 10px rgba(37,99,235,.25);}
.mo{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .28s;}
.mo.open{opacity:1;pointer-events:all;}
.ms{width:100%;max-width:480px;background:rgba(255,255,255,.97);backdrop-filter:blur(20px);border-radius:22px 22px 0 0;padding:6px 0 0;transform:translateY(100%);transition:transform .36s cubic-bezier(.4,0,.2,1);max-height:92vh;overflow-y:auto;}
.mo.open .ms{transform:translateY(0);}
.mh{width:36px;height:4px;background:var(--gray-200);border-radius:2px;margin:0 auto 14px;}
.mb{padding:0 18px 28px;}
.mt{font-size:17px;font-weight:800;color:var(--gray-900);margin-bottom:18px;text-align:center;}
.fg{margin-bottom:12px;}
.fl{display:block;font-size:11px;font-weight:700;color:var(--gray-500);margin-bottom:5px;padding-right:3px;}
.fi,.fsel,.fta{width:100%;padding:12px 13px;border-radius:11px;border:1.5px solid var(--gray-200);background:var(--gray-50);font-size:13px;font-family:'Cairo',sans-serif;color:var(--gray-900);outline:none;transition:border-color .2s;direction:rtl;}
.fi:focus,.fsel:focus,.fta:focus{border-color:var(--blue);background:white;}
.fta{min-height:72px;resize:vertical;}
.chip{display:inline-flex;align-items:center;gap:3px;padding:4px 11px;border-radius:20px;font-size:11px;font-weight:600;font-family:'Cairo',sans-serif;cursor:pointer;border:1.5px solid transparent;transition:all .18s;}
.chip-a{background:rgba(37,99,235,.09);border-color:rgba(37,99,235,.25);color:var(--blue);}
.chip-i{background:var(--gray-100);color:var(--gray-500);}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;text-align:center;}
.empty .material-icons-round{font-size:52px;color:var(--gray-300);margin-bottom:14px;}
.empty h3{font-size:15px;font-weight:700;color:var(--gray-400);margin-bottom:4px;}
.empty p{font-size:12px;color:var(--gray-300);}
.tl-item{display:flex;gap:10px;padding-bottom:18px;position:relative;}
.tl-item:not(:last-child)::after{content:'';position:absolute;right:17px;top:34px;bottom:0;width:1px;background:var(--gray-200);}
.tl-dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cbbox{width:19px;height:19px;border-radius:5px;border:2px solid var(--gray-300);background:white;display:flex;align-items:center;justify-content:center;transition:all .18s;flex-shrink:0;}
.cbbox.chk{background:var(--blue);border-color:var(--blue);}
.cbbox.chk::after{content:'';width:9px;height:5px;border-left:2px solid white;border-bottom:2px solid white;transform:rotate(-45deg) translateY(-1px);}
.stat-c{background:white;border-radius:var(--r-lg);padding:14px;text-align:center;box-shadow:var(--sh-sm);border:1px solid rgba(255,255,255,.9);}
.stat-v{font-size:26px;font-weight:900;letter-spacing:-1px;line-height:1;}
.stat-l{font-size:10px;font-weight:600;color:var(--gray-400);margin-top:3px;}
@keyframes slideUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92);}to{opacity:1;transform:scale(1);}}
@keyframes spin{to{transform:rotate(360deg);}}
.ai{animation:slideUp .35s ease both;}
.ai:nth-child(1){animation-delay:.04s;}.ai:nth-child(2){animation-delay:.08s;}
.ai:nth-child(3){animation-delay:.12s;}.ai:nth-child(4){animation-delay:.16s;}
.ai:nth-child(5){animation-delay:.20s;}.ai:nth-child(6){animation-delay:.24s;}
.ai:nth-child(7){animation-delay:.28s;}.ai:nth-child(8){animation-delay:.32s;}
.cp{padding:14px 16px calc(var(--nav)+18px);}
.cph{padding:12px 16px calc(var(--nav)+18px);}
.sj-tag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;}
.sj-ar{background:rgba(239,68,68,.08);color:#DC2626;}
.sj-en{background:rgba(37,99,235,.08);color:#2563EB;}
.sj-ph{background:rgba(139,92,246,.08);color:#7C3AED;}
.sj-ch{background:rgba(16,185,129,.08);color:#059669;}
.sj-bi{background:rgba(245,158,11,.08);color:#D97706;}
.sj-ma{background:rgba(236,72,153,.08);color:#BE185D;}
.cv{cursor:pointer;transition:transform .18s,box-shadow .18s;}
.cv:active{transform:scale(.98);}
.loading-cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(248,250,252,.9);z-index:50;}
.spinner{width:36px;height:36px;border:3px solid var(--gray-200);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;}
.home-btn-col{display:flex;flex-direction:column;gap:14px;width:100%;}
.home-btn-glass{background:rgba(255,255,255,0.55);backdrop-filter:blur(18px) saturate(1.8);-webkit-backdrop-filter:blur(18px) saturate(1.8);border:1px solid rgba(255,255,255,0.75);box-shadow:var(--sh-lg);border-radius:var(--r-xl);padding:22px 20px;cursor:pointer;transition:transform .2s cubic-bezier(.4,0,.2,1),box-shadow .2s;animation:slideUp .4s ease both;}
.home-btn-glass:active{transform:scale(.97);}
.home-btn-glass:nth-child(1){animation-delay:.18s;}
.home-btn-glass:nth-child(2){animation-delay:.26s;}
.up-area{border:2px dashed var(--gray-300);border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;}
.up-area:hover{border-color:var(--blue);background:var(--blue-glass);}
.up-area .material-icons-round{font-size:32px;color:var(--gray-400);margin-bottom:6px;}
.up-area p{font-size:12px;color:var(--gray-500);}
.up-prog{height:6px;background:var(--gray-200);border-radius:3px;overflow:hidden;margin-top:8px;}
.up-prog-fill{height:100%;background:linear-gradient(90deg,var(--blue-light),var(--blue-dark));border-radius:3px;transition:width .3s ease;}
.col-dots{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px;}
.col-dot{width:28px;height:28px;border-radius:8px;cursor:pointer;transition:transform .15s;border:2px solid transparent;}
.col-dot.sel{border-color:var(--gray-900);transform:scale(1.15);}
.icon-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:5px;}
.icon-opt{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--gray-100);cursor:pointer;transition:all .15s;border:2px solid transparent;}
.icon-opt.sel{border-color:var(--blue);background:var(--blue-glass);}
.icon-opt .material-icons-round{font-size:20px;color:var(--gray-500);}
.icon-opt.sel .material-icons-round{color:var(--blue);}
.del-confirm{background:rgba(239,68,68,.06);border:1.5px solid rgba(239,68,68,.18);border-radius:12px;padding:12px 14px;margin-top:8px;}
.del-confirm p{font-size:12px;color:var(--danger);margin-bottom:8px;text-align:center;}
.del-confirm-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.img-preview{width:100%;height:120px;object-fit:cover;border-radius:10px;margin-top:6px;}
.pdf-preview{display:flex;align-items:center;gap:10px;background:var(--gray-50);border-radius:10px;padding:10px 12px;margin-top:6px;}
.pdf-preview .material-icons-round{font-size:28px;color:#DC2626;}
.pdf-preview span{font-size:12px;color:var(--gray-700);font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
</style>
</head>
<body>
<div id="app">

<div class="screen active" id="screen-home">
  <div style="flex:1;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 22px;">
    <div style="text-align:center;margin-bottom:40px;animation:scaleIn .55s cubic-bezier(.4,0,.2,1) both;">
      <div style="width:84px;height:84px;background:linear-gradient(135deg,var(--blue-light),var(--blue-dark));border-radius:26px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:0 14px 36px rgba(37,99,235,.3);">
        <span class="material-icons-round" style="font-size:38px;color:white;">track_changes</span>
      </div>
      <h1 style="font-size:46px;font-weight:900;color:var(--blue);letter-spacing:-2px;line-height:1;">تابع</h1>
      <p style="font-size:14px;color:var(--gray-400);margin-top:7px;font-weight:500;">منصة متابعة دراسية شخصية</p>
    </div>
    <div class="home-btn-col" style="max-width:360px;">
      <div class="home-btn-glass" onclick="openDashboard('student')">
        <div style="display:flex;align-items:center;gap:16px;">
          <div style="width:54px;height:54px;background:linear-gradient(135deg,var(--blue-light),var(--blue-dark));border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(37,99,235,.28);flex-shrink:0;">
            <span class="material-icons-round" style="font-size:26px;color:white;">school</span>
          </div>
          <div style="flex:1;">
            <div style="font-size:24px;font-weight:900;color:var(--gray-900);letter-spacing:-.8px;">واصل</div>
            <div style="font-size:13px;color:var(--gray-400);margin-top:2px;">لوحة الطالب</div>
          </div>
          <span class="material-icons-round" style="color:var(--blue);font-size:20px;transform:scaleX(-1);">arrow_forward_ios</span>
        </div>
      </div>
      <div class="home-btn-glass" onclick="openDashboard('parent')">
        <div style="display:flex;align-items:center;gap:16px;">
          <div style="width:54px;height:54px;background:rgba(37,99,235,.12);border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <span class="material-icons-round" style="font-size:26px;color:var(--blue);">supervisor_account</span>
          </div>
          <div style="flex:1;">
            <div style="font-size:24px;font-weight:900;color:var(--gray-900);letter-spacing:-.8px;">تابع</div>
            <div style="font-size:13px;color:var(--gray-400);margin-top:2px;">لوحة المتابعة</div>
          </div>
          <span class="material-icons-round" style="color:var(--blue);font-size:20px;transform:scaleX(-1);">arrow_forward_ios</span>
        </div>
      </div>
    </div>
    <p style="font-size:10px;color:var(--gray-300);margin-top:30px;animation:fadeIn .5s .5s both;">نسخة 1.0 — تابع © 2024</p>
  </div>
</div>

<div class="screen" id="screen-student">
  <div style="flex:1;overflow:hidden;display:flex;flex-direction:column;">
    <div id="spg" style="flex:1;overflow:hidden;position:relative;"></div>
  </div>
  <nav class="bottom-nav" id="snav">
    <button class="ni active" onclick="showSP('home')" data-p="home"><span class="material-icons-round">home</span><span class="lbl">الرئيسية</span></button>
    <button class="ni" onclick="showSP('subjects')" data-p="subjects"><span class="material-icons-round">menu_book</span><span class="lbl">المواد</span></button>
    <button class="ni" onclick="showSP('library')" data-p="library"><span class="material-icons-round">local_library</span><span class="lbl">المكتبة</span></button>
    <button class="ni" onclick="showSP('grades')" data-p="grades"><span class="material-icons-round">grade</span><span class="lbl">الدرجات</span></button>
    <button class="ni" onclick="showSP('tasks')" data-p="tasks"><span class="material-icons-round">task_alt</span><span class="lbl">المهام</span></button>
    <button class="ni" onclick="showSP('more')" data-p="more"><span class="material-icons-round">more_horiz</span><span class="lbl">المزيد</span></button>
  </nav>
</div>

<div class="screen" id="screen-parent">
  <div style="flex:1;overflow:hidden;display:flex;flex-direction:column;">
    <div id="ppg" style="flex:1;overflow:hidden;position:relative;"></div>
  </div>
  <nav class="bottom-nav" id="pnav">
    <button class="ni active" onclick="showPP('overview')" data-p="overview"><span class="material-icons-round">dashboard</span><span class="lbl">نظرة عامة</span></button>
    <button class="ni" onclick="showPP('tasks')" data-p="tasks"><span class="material-icons-round">assignment</span><span class="lbl">المهام</span></button>
    <button class="ni" onclick="showPP('grades')" data-p="grades"><span class="material-icons-round">grade</span><span class="lbl">الدرجات</span></button>
    <button class="ni" onclick="showPP('attendance')" data-p="attendance"><span class="material-icons-round">event_available</span><span class="lbl">الحضور</span></button>
    <button class="ni" onclick="showPP('activity')" data-p="activity"><span class="material-icons-round">timeline</span><span class="lbl">النشاط</span></button>
  </nav>
</div>

<div class="screen" id="screen-more">
  <div style="flex:1;overflow:hidden;display:flex;flex-direction:column;">
    <div id="mpg" style="flex:1;overflow:hidden;position:relative;"></div>
  </div>
  <nav class="bottom-nav" id="mnav">
    <button class="ni" onclick="goBack()"><span class="material-icons-round">arrow_forward</span><span class="lbl">رجوع</span></button>
    <button class="ni" onclick="showMP('teachers')" data-p="teachers"><span class="material-icons-round">person</span><span class="lbl">المدرسون</span></button>
    <button class="ni" onclick="showMP('locations')" data-p="locations"><span class="material-icons-round">location_on</span><span class="lbl">الأماكن</span></button>
    <button class="ni active" onclick="showMP('attendance')" data-p="attendance"><span class="material-icons-round">fact_check</span><span class="lbl">سجل الحضور</span></button>
  </nav>
</div>

<div class="mo" id="modal"><div class="ms"><div class="mh"></div><div class="mb" id="mbody"></div></div></div>

<input type="file" accept="image/*" capture="environment" id="cam-input" style="display:none">
<input type="file" accept="image/*" id="gal-input" style="display:none">
<input type="file" accept="application/pdf" id="pdf-input" style="display:none">
<input type="file" accept="image/*,application/pdf" id="file-input-any" style="display:none">

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc,
  doc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

async function loadAll(col){
  try{
    const snap = await getDocs(FS[col]);
    Cache[col] = snap.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){ Cache[col]=[]; }
}

async function fsAdd(col, data){
  const ref = await addDoc(FS[col], {...data, createdAt: serverTimestamp()});
  return ref.id;
}
async function fsUpdate(col, id, data){
  await updateDoc(doc(db,col,id), data);
}
async function fsDel(col, id){
  await deleteDoc(doc(db,col,id));
}

async function addActivity(text, icon, color){
  const now = new Date();
  const time = now.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})+' · '+now.toLocaleDateString('ar-EG',{month:'short',day:'numeric'});
  const data = {text, icon:icon||'circle', color:color||'#2563EB', time};
  try{
    const nid = await fsAdd('activity', data);
    Cache.activity.unshift({id:nid,...data});
  }catch(e){
    Cache.activity.unshift({id:uid(),...data});
  }
}

function uploadFileToStorage(path, file, onProgress){
  return new Promise((resolve, reject)=>{
    const ref = sRef(storage, path);
    const task = uploadBytesResumable(ref, file);
    task.on('state_changed',
      snap => { if(onProgress) onProgress(Math.round(snap.bytesTransferred/snap.totalBytes*100)); },
      err => reject(err),
      async ()=>{ try{ const url = await getDownloadURL(task.snapshot.ref); resolve(url); }catch(e){ reject(e); } }
    );
  });
}

async function deleteStorageFile(url){
  try{
    const ref = sRef(storage, url);
    await deleteObject(ref);
  }catch(e){}
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2); }

function subColor(n){
  if(!n) return '#2563EB';
  if(n.includes('عربي')) return '#EF4444';
  if(n.includes('نجلي')||n.includes('English')||n.includes('انجلي')) return '#3B82F6';
  if(n.includes('فيزيا')||n.includes('Physics')) return '#8B5CF6';
  if(n.includes('يمياء')||n.includes('Chem')) return '#10B981';
  if(n.includes('حياء')||n.includes('Bio')) return '#F59E0B';
  if(n.includes('رياضي')||n.includes('Math')) return '#EC4899';
  return '#2563EB';
}
function subTag(n){
  if(!n) return 'sj-ar';
  if(n.includes('عربي')) return 'sj-ar';
  if(n.includes('نجلي')||n.includes('انجلي')) return 'sj-en';
  if(n.includes('فيزيا')) return 'sj-ph';
  if(n.includes('يمياء')) return 'sj-ch';
  if(n.includes('حياء')) return 'sj-bi';
  if(n.includes('رياضي')) return 'sj-ma';
  return 'sj-ar';
}
function fmtDate(d){
  if(!d) return '';
  try{
    const dt = d.toDate ? d.toDate() : new Date(d);
    return dt.toLocaleDateString('ar-EG',{year:'numeric',month:'short',day:'numeric'});
  }catch(e){ return d||''; }
}

window.saveSubject = async function(){
  const name = (document.getElementById('sub-name').value||'').trim();
  if(!name) return;
  const color = document.querySelector('.col-dot.sel')?.dataset.color || window._selColor;
  const icon = document.querySelector('.icon-opt.sel')?.dataset.icon || window._selIcon;
  const data = {name, color, icon};
  if(_eid){
    const s = Cache.subjects.find(x=>x.id===_eid);
    if(s) Object.assign(s,data);
    try{ await fsUpdate('subjects',_eid,data); }catch(e){}
  } else {
    const newData = {...data, progress:0, units:[]};
    try{
      const nid = await fsAdd('subjects', newData);
      Cache.subjects.push({id:nid,...newData});
    }catch(e){
      Cache.subjects.push({id:uid(),...newData});
    }
    addActivity(`تمت إضافة مادة ${name}`, 'menu_book', color);
  }
  closeMo();
  document.getElementById('spg').innerHTML = await pgSubjects();
  initPBs();
};

window.toggleLesson = async function(e, sId, uId, lId){
  e.stopPropagation();
  const s = Cache.subjects.find(x=>x.id===sId);
  const u = s&&(s.units||[]).find(x=>x.id===uId);
  const l = u&&(u.lessons||[]).find(x=>x.id===lId);
  if(!l) return;
  l.done = !l.done;
  const cb = document.getElementById(`cb-${sId}-${uId}-${lId}`);
  if(cb) cb.classList.toggle('chk',l.done);
  const allLessons = (s.units||[]).flatMap(un=>un.lessons||[]);
  s.progress = allLessons.length?Math.round(allLessons.filter(x=>x.done).length/allLessons.length*100):0;
  try{ await fsUpdate('subjects',sId,{units:s.units,progress:s.progress}); }catch(e){}

};

  if(!f.length) return `<div class="empty"><span class="material-icons-round">find_in_page</span><h3>لا توجد نتائج</h3><p>اضغط + لإضافة ملف</p></div>`;
  return f.map(i=>{
    const col = subColor(i.subject);
    const iconName = i.fileType==='image'?'image':i.category==='الكتب'?'menu_book':i.category==='الملخصات'?'summarize':'rate_review';
    return `
    <div class="glass card ai" style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
      <div style="width:48px;height:48px;border-radius:12px;background:${col}12;display:flex;align-items:center;justify-content:center;flex-shrink:0;">

      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${i.title||'—'}</div>
        <div style="display:flex;gap:5px;margin-top:3px;flex-wrap:wrap;">
          <span class="badge bdg-b" style="font-size:9px;">${i.category||''}</span>
          <span class="sj-tag ${subTag(i.subject)}" style="font-size:9px;">${i.subject||''}</span>
          ${i.size?`<span style="font-size:10px;color:var(--gray-400);">${i.size}</span>`:''}
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:3px;">
        ${i.fileUrl?`<button class="btn btn-ok" onclick="openLibFile('${i.fileUrl}')"><span class="material-icons-round" style="font-size:15px;">open_in_new</span></button>`:''}
        <button class="btn btn-icon" onclick="openLibModal('${i.id}')"><span class="material-icons-round" style="font-size:14px;">edit</span></button>
        <button class="btn btn-del" onclick="confirmDelLib('${i.id}')"><span class="material-icons-round" style="font-size:14px;">delete</span></button>

function handlePdfFile(file){
  if(!file) return;

  if(fname){

function handleImgFile(file){
  if(!file) return;
  _pendingFile = file;
  _pendingFileType = 'image';
  _pendingFileURL = null;
  const reader = new FileReader();
  reader.onload = e=>{
    const wrap = document.getElementById('img-preview-wrap');
    if(wrap) wrap.innerHTML = `<img src="${e.target.result}" class="img-preview" alt="preview">`;
    const drop = document.getElementById('lib-drop');
    if(drop) drop.innerHTML = `<span class="material-icons-round" style="color:var(--success);">check_circle</span><p>تم اختيار الصورة</p>`;
  };
  reader.readAsDataURL(file);
}

window.saveLibItem = async function(){
  const title = (document.getElementById('lib-title')?.value||'').trim();
  if(!title){ document.getElementById('lib-title').focus(); return; }
  const sub = document.getElementById('lib-sub')?.value||'';
  const cat = document.getElementById('lib-cat')?.value||'الكتب';
  const btn = document.getElementById('lib-save-btn');
  if(btn){ btn.disabled=true; btn.innerHTML='<span class="material-icons-round" style="animation:spin .7s linear infinite;font-size:17px;">refresh</span>جارٍ الحفظ...'; }
  let fileUrl = (_eid?Cache.library.find(x=>x.id===_eid)?.fileUrl:null)||null;
  let fileType = (_eid?Cache.library.find(x=>x.id===_eid)?.fileType:null)||null;
  let size = (_eid?Cache.library.find(x=>x.id===_eid)?.size:null)||null;
  if(_pendingFile){
    const prog = document.getElementById('lib-prog');
    const pf = document.getElementById('lib-pf');
    if(prog) prog.style.display='block';
    const ext = _pendingFile.name.split('.').pop();
    const path = `library/${uid()}.${ext}`;
    try{
      fileUrl = await uploadFileToStorage(path, _pendingFile, p=>{ if(pf) pf.style.width=p+'%'; });
      fileType = _pendingFileType;
      size = _pendingFile.size>1024*1024?(_pendingFile.size/1024/1024).toFixed(1)+' MB':(_pendingFile.size/1024).toFixed(0)+' KB';
    }catch(e){
      if(btn){ btn.disabled=false; btn.innerHTML='<span class="material-icons-round" style="font-size:17px;">error</span>فشل الرفع'; }
      return;
    }
  }
  const data = {title, subject:sub, category:cat, fileUrl:fileUrl||'', fileType:fileType||'pdf', size:size||''};
  if(_eid){
    const item = Cache.library.find(x=>x.id===_eid);
    if(item) Object.assign(item,data);
    try{ await fsUpdate('library',_eid,data); }catch(e){}
  } else {
    try{
      const nid = await fsAdd('library',data);
      Cache.library.unshift({id:nid,...data});
    }catch(e){ Cache.library.unshift({id:uid(),...data}); }
    addActivity(`تمت إضافة "${title}" للمكتبة`, 'local_library', '#2563EB');
  }
  closeMo();
  const spg = document.getElementById('spg');
  if(spg && spg.querySelector('#lib-pg')) { spg.innerHTML = await pgLibrary(); initPBs(); }
};

window.saveGrade = async function(){
  const exam = (document.getElementById('gr-exam')?.value||'').trim();
  const grade = parseFloat(document.getElementById('gr-grade')?.value||0);
  const total = parseFloat(document.getElementById('gr-total')?.value||100);
  if(!exam||isNaN(grade)||isNaN(total)||total<=0) return;
  const data = {
    exam,
    subject: document.getElementById('gr-sub')?.value||'',
    grade, total,
    date: document.getElementById('gr-date')?.value||'',
    notes: document.getElementById('gr-notes')?.value||''
  };
  if(_eid){
    const g = Cache.grades.find(x=>x.id===_eid);
    if(g) Object.assign(g,data);
    try{ await fsUpdate('grades',_eid,data); }catch(e){}
  } else {
    try{
      const nid = await fsAdd('grades',data);
      Cache.grades.unshift({id:nid,...data});
    }catch(e){ Cache.grades.unshift({id:uid(),...data}); }
    addActivity(`تم تسجيل درجة ${exam} في ${data.subject}: ${grade}/${total}`, 'grade', gcol(gpct(grade,total)));
  }
  closeMo();
  document.getElementById('spg').innerHTML = await pgGrades();
  initPBs();
};

      <p>هل تريد حذف درجة "${g?g.exam:'هذا الاختبار'}" نهائياً؟</p>
      <div class="del-confirm-btns">
        <button class="btn btn-ghost" style="width:100%;" onclick="closeMo()">إلغاء</button>

      </div>

};

window.delGrade = async function(id){
  const idx = Cache.grades.findIndex(x=>x.id===id);

async function pgTasks(){
  await loadAll('tasks');

}
function renderTasksPage(role){
  const tasks = Cache.tasks;
  const pending = tasks.filter(t=>t.status==='pending').length;
  return `
  <div class="page-scroll" id="tpg-${role}" style="padding-bottom:calc(var(--nav)+80px);">
    <div class="ph">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div><h1>المهام</h1><p>${pending} مهمة معلقة</p></div>
      </div>
      <div style="display:flex;gap:5px;margin-top:8px;overflow-x:auto;scrollbar-width:none;" id="tfil-${role}">
        ${['الكل','قيد التنفيذ','تم','فشل'].map((f,i)=>`<button class="chip ${i===0?'chip-a':'chip-i'}" style="white-space:nowrap;border:none;" onclick="filterTasks('${f}','${role}',this)">${f}</button>`).join('')}
      </div>
    </div>
    <div class="cp" id="tlist-${role}">${renderTaskList(tasks,role,'الكل')}</div>
  </div>
  <button class="fab" onclick="openTaskModal(null,'${role}')"><span class="material-icons-round">add</span></button>`;
}

function renderTaskList(tasks, role, filter){
  const f = filter==='الكل'?tasks:tasks.filter(t=>
    filter==='قيد التنفيذ'?t.status==='pending':filter==='تم'?t.status==='done':t.status==='failed');
  if(!f.length) return `<div class="empty"><span class="material-icons-round">task_alt</span><h3>لا توجد مهام</h3><p>اضغط + لإضافة مهمة</p></div>`;
  return f.map(t=>`
    <div class="glass card ai" style="margin-bottom:8px;border-right:3px solid ${t.status==='done'?'#10B981':t.status==='failed'?'#EF4444':'#F59E0B'};">
      <div style="display:flex;align-items:flex-start;gap:10px;">
        <div style="flex:1;">
          <div style="font-size:13px;font-weight:700;text-decoration:${t.status==='done'?'line-through':'none'};color:${t.status==='done'?'var(--gray-400)':'var(--gray-900)'};">${t.title||'—'}</div>
          <div style="display:flex;gap:5px;flex-wrap:wrap;margin:4px 0;">
            <span class="sj-tag ${subTag(t.subject)}">${t.subject||''}</span>
            <span class="badge ${t.status==='done'?'bdg-s':t.status==='failed'?'bdg-d':'bdg-w'}">${t.status==='done'?'تم':t.status==='failed'?'فشل':'قيد التنفيذ'}</span>
            <span class="badge bdg-g" style="font-size:9px;">${t.priority==='high'?'أولوية عالية':t.priority==='medium'?'متوسطة':'منخفضة'}</span>
          </div>
          <div style="font-size:10px;color:var(--gray-400);display:flex;align-items:center;gap:3px;">
            <span class="material-icons-round" style="font-size:11px;">schedule</span>${t.deadline?fmtDate(t.deadline):'—'}
          </div>
          ${t.notes?`<p style="font-size:10px;color:var(--gray-500);margin-top:3px;font-style:italic;">${t.notes}</p>`:''}
        </div>
        <div style="display:flex;flex-direction:column;gap:3px;flex-shrink:0;">
          ${t.status!=='done'?`<button class="btn btn-ok" onclick="setTaskSt('${t.id}','done','${role}')"><span class="material-icons-round" style="font-size:14px;">check</span></button>`:''}
          ${t.status==='pending'?`<button class="btn btn-fail" onclick="setTaskSt('${t.id}','failed','${role}')"><span class="material-icons-round" style="font-size:14px;">close</span></button>`:''}
          <button class="btn btn-icon" onclick="openTaskModal('${t.id}','${role}')"><span class="material-icons-round" style="font-size:14px;">edit</span></button>
          <button class="btn btn-del" onclick="confirmDelTask('${t.id}','${role}')"><span class="material-icons-round" style="font-size:14px;">delete</span></button>
        </div>
      </div>
    </div>`).join('');
}

window.filterTasks = function(f, role, btn){
  document.getElementById(`tfil-${role}`)?.querySelectorAll('.chip').forEach(el=>el.className='chip '+(el===btn?'chip-a':'chip-i'));
  const ll = document.getElementById(`tlist-${role}`);
  if(ll) ll.innerHTML = renderTaskList(Cache.tasks,role,f);
};

window.setTaskSt = async function(id, status, role){
  const t = Cache.tasks.find(x=>x.id===id);
  if(t){
    t.status=status;
    try{ await fsUpdate('tasks',id,{status}); }catch(e){}
    if(status==='done') addActivity(`تم إنجاز مهمة: ${t.title}`, 'check_circle', '#10B981');
  }
  refreshTasks(role);
};

window.delTask = async function(id, role){

function refreshTasks(role){

function handleTeacherImg(file){

  _pendingFile = file;
  _pendingFileType = 'image';
  const reader = new FileReader();
  reader.onload = e=>{
    const wrap = document.getElementById('teacher-img-preview');
    if(wrap) wrap.innerHTML = `<img src="${e.target.result}" style="width:70px;height:70px;border-radius:50%;object-fit:cover;margin-top:8px;display:block;">`;
  };
  reader.readAsDataURL(file);

window.saveTeacher = async function(){
  const name = (document.getElementById('tc-name')?.value||'').trim();
  if(!name) return;

  if(btn){ btn.disabled=true; btn.innerHTML='<span class="material-icons-round" style="animation:spin .7s linear infinite;font-size:17px;">refresh</span>جارٍ الحفظ...'; }

  if(_pendingFile){
    try{
      photoUrl = await uploadFileToStorage(`teachers/${uid()}.jpg`, _pendingFile, ()=>{});
    }catch(e){}
  }
  const color = document.querySelector('.col-dot.sel')?.dataset.color || window._selColor;
  const data = {
    name,
    initials: document.getElementById('tc-init')?.value||name.slice(0,2),

    subscribers: document.getElementById('tc-subs')?.value||'',
    videos: document.getElementById('tc-vids')?.value||'',
    url: document.getElementById('tc-url')?.value||'',
    photoUrl: photoUrl||''
  };
  if(_eid){
    const t = Cache.teachers.find(x=>x.id===_eid);
    if(t) Object.assign(t,data);
    try{ await fsUpdate('teachers',_eid,data); }catch(e){}
  } else {
    try{
      const nid = await fsAdd('teachers',data);
      Cache.teachers.push({id:nid,...data});
    }catch(e){ Cache.teachers.push({id:uid(),...data}); }

  closeMo();
  document.getElementById('mpg').innerHTML = await pgTeachers();
};

  openMo();
};

window.delTeacher = async function(id){
  const t = Cache.teachers.find(x=>x.id===id);
  if(t?.photoUrl){ try{ await deleteStorageFile(t.photoUrl); }catch(e){} }
  const idx = Cache.teachers.findIndex(x=>x.id===id);
  if(idx!==-1){ try{ await fsDel('teachers',id); }catch(e){} Cache.teachers.splice(idx,1); }
  closeMo();
  document.getElementById('mpg').innerHTML = await pgTeachers();
};

  <div class="page-scroll" style="padding-bottom:calc(var(--nav)+80px);">
    <div class="ph"><h1>الأماكن التعليمية</h1><p>${locs.length} مكان مسجل</p></div>
    <div class="cp">
      ${!locs.length?`<div class="empty"><span class="material-icons-round">location_on</span><h3>لا توجد أماكن</h3><p>اضغط + لإضافة مكان</p></div>`:''}
      ${locs.map(l=>{const col=subColor(l.subject);return`
        <div class="glass card ai" style="margin-bottom:10px;">
          <div style="display:flex;align-items:flex-start;gap:11px;margin-bottom:10px;">
            <div style="width:44px;height:44px;border-radius:12px;background:${col}12;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <span class="material-icons-round" style="color:${col};font-size:21px;">location_on</span>
            </div>
            <div style="flex:1;">
              <div style="font-size:14px;font-weight:800;">${l.name||'—'}</div>
              <span class="sj-tag ${subTag(l.subject)}">${l.subject||''}</span>
            </div>
            <div style="display:flex;gap:4px;">
              <button class="btn btn-icon" style="width:32px;height:32px;border-radius:8px;" onclick="openLocationModal('${l.id}')"><span class="material-icons-round" style="font-size:14px;">edit</span></button>
              <button class="btn btn-del" style="width:32px;height:32px;border-radius:8px;" onclick="confirmDelLocation('${l.id}')"><span class="material-icons-round" style="font-size:14px;">delete</span></button>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px;">
            ${l.address?`<div style="display:flex;align-items:flex-start;gap:7px;"><span class="material-icons-round" style="font-size:13px;color:var(--gray-400);margin-top:1px;">place</span><span style="font-size:11px;color:var(--gray-500);">${l.address}</span></div>`:''}
            ${l.schedule?`<div style="display:flex;align-items:center;gap:7px;"><span class="material-icons-round" style="font-size:13px;color:var(--gray-400);">schedule</span><span style="font-size:11px;color:var(--gray-500);">${l.schedule}</span></div>`:''}
            ${l.notes?`<div style="display:flex;align-items:flex-start;gap:7px;"><span class="material-icons-round" style="font-size:13px;color:var(--gray-400);margin-top:1px;">info</span><span style="font-size:11px;color:var(--gray-500);">${l.notes}</span></div>`:''}
          </div>
          ${l.mapUrl?`<a href="${l.mapUrl}" target="_blank" class="btn btn-p" style="width:100%;text-decoration:none;display:flex;justify-content:center;"><span class="material-icons-round" style="font-size:17px;">map</span>فتح في الخريطة</a>`:''}
        </div>`}).join('')}
    </div>
  </div>
  <button class="fab" onclick="openLocationModal(null)"><span class="material-icons-round">add</span></button>`;
}

window.openLocationModal = function(id){
  _eid = id;
  const l = id?Cache.locations.find(x=>x.id===id):null;
  const subs = Cache.subjects.length?Cache.subjects.map(s=>`<option value="${s.name}" ${l&&l.subject===s.name?'selected':''}>${s.name}</option>`).join(''):
    ['اللغة العربية','اللغة الإنجليزية','الفيزياء','الكيمياء','الأحياء','الرياضيات'].map(s=>`<option value="${s}" ${l&&l.subject===s?'selected':''}>${s}</option>`).join('');
  document.getElementById('mbody').innerHTML = `
    <div class="mt">${l?'تعديل المكان':'إضافة مكان تعليمي'}</div>
    <div class="fg"><label class="fl">اسم المكان</label><input class="fi" id="lc-name" value="${l?l.name:''}" placeholder="مثال: سنتر الأستاذ أحمد"></div>
    <div class="fg"><label class="fl">المادة</label><select class="fsel" id="lc-sub">${subs}</select></div>
    <div class="fg"><label class="fl">العنوان</label><input class="fi" id="lc-addr" value="${l?l.address||'':''}" placeholder="العنوان بالتفصيل"></div>
    <div class="fg"><label class="fl">جدول المواعيد</label><input class="fi" id="lc-sch" value="${l?l.schedule||'':''}" placeholder="مثال: السبت والإثنين 4 مساءً"></div>
    <div class="fg"><label class="fl">ملاحظات</label><textarea class="fta" id="lc-notes" placeholder="معلومات إضافية...">${l?l.notes||'':''}</textarea></div>
    <div class="fg"><label class="fl">رابط Google Maps</label><input class="fi" id="lc-map" value="${l?l.mapUrl||'':''}" placeholder="https://maps.google.com/..."></div>
    <button class="btn btn-p" style="width:100%;margin-top:6px;" onclick="saveLocation()">
      <span class="material-icons-round" style="font-size:17px;">${l?'save':'add'}</span>${l?'حفظ التعديلات':'إضافة المكان'}
    </button>`;
  openMo();
};

window.saveLocation = async function(){
  const name = (document.getElementById('lc-name')?.value||'').trim();
  if(!name) return;
  const data = {
    name,
    subject: document.getElementById('lc-sub')?.value||'',
    address: document.getElementById('lc-addr')?.value||'',
    schedule: document.getElementById('lc-sch')?.value||'',
    notes: document.getElementById('lc-notes')?.value||'',
    mapUrl: document.getElementById('lc-map')?.value||''
  };
  if(_eid){
    const l = Cache.locations.find(x=>x.id===_eid);
    if(l) Object.assign(l,data);
    try{ await fsUpdate('locations',_eid,data); }catch(e){}
  } else {
    try{
      const nid = await fsAdd('locations',data);
      Cache.locations.push({id:nid,...data});
    }catch(e){ Cache.locations.push({id:uid(),...data}); }
  }
  closeMo();
  document.getElementById('mpg').innerHTML = await pgLocations();
};

window.confirmDelLocation = function(id){
  const l = Cache.locations.find(x=>x.id===id);
  document.getElementById('mbody').innerHTML = `
    <div class="mt">حذف المكان</div>
    <div class="del-confirm">
      <p>هل تريد حذف "${l?l.name:'هذا المكان'}" نهائياً؟</p>
      <div class="del-confirm-btns">
        <button class="btn btn-ghost" style="width:100%;" onclick="closeMo()">إلغاء</button>
        <button class="btn" style="width:100%;background:var(--danger);color:white;border-radius:var(--r-sm);padding:11px;" onclick="delLocation('${id}')">حذف</button>
      </div>
    </div>`;
  openMo();
};

window.delLocation = async function(id){
  const idx = Cache.locations.findIndex(x=>x.id===id);
  if(idx!==-1){ try{ await fsDel('locations',id); }catch(e){} Cache.locations.splice(idx,1); }
  closeMo();
  document.getElementById('mpg').innerHTML = await pgLocations();
};

async function pgAttendance(){
  await Promise.all([loadAll('attendance'),loadAll('subjects'),loadAll('locations')]);
  const att = Cache.attendance;
  const subOpts = Cache.subjects.length?Cache.subjects.map(s=>`<option value="${s.name}">${s.name}</option>`).join(''):
    ['اللغة العربية','اللغة الإنجليزية','الفيزياء','الكيمياء','الأحياء','الرياضيات'].map(s=>`<option value="${s}">${s}</option>`).join('');
  const locOpts = Cache.locations.length?Cache.locations.map(l=>`<option value="${l.name}">${l.name}</option>`).join(''):`<option value="منزل">منزل</option><option value="مركز تعليمي">مركز تعليمي</option>`;
  return `
  <div class="page-scroll" id="attpg" style="padding-bottom:calc(var(--nav)+18px);">
    <div class="ph"><h1>سجل الحضور</h1><p>${att.length} سجل حضور</p></div>
    <div class="cp">
      <div class="sec">تسجيل حضور جديد</div>
      <div class="glass card ai" style="margin-bottom:14px;">
        <div class="fg"><label class="fl">المادة</label><select class="fsel" id="att-sub">${subOpts}</select></div>
        <div class="fg"><label class="fl">المكان</label><select class="fsel" id="att-loc">${locOpts}</select></div>
        <button class="btn btn-p" id="att-btn" style="width:100%;padding:15px;font-size:15px;margin-top:2px;" onclick="recordAtt()">
          <span class="material-icons-round" style="font-size:20px;">check_circle</span>تم الوصول
        </button>
      </div>
      <div class="sec">السجل السابق (${att.length})</div>
      <div id="att-list">${renderAttList(att)}</div>
    </div>
  </div>`;
}

function renderAttList(att){
  if(!att.length) return `<div class="empty"><span class="material-icons-round">event_busy</span><h3>لا يوجد سجل حضور</h3><p>سجل أول حضور لك</p></div>`;
  return att.map(a=>`
    <div class="tl-item ai">
      <div class="tl-dot" style="background:rgba(37,99,235,.07);">
        <span class="material-icons-round" style="font-size:17px;color:var(--blue);">fact_check</span>
      </div>
      <div style="flex:1;">
        <div class="glass2 cardsm" style="border-right:3px solid var(--success);">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">
            <span style="font-size:12px;font-weight:700;">${a.subject||'—'}</span>
            <span class="badge bdg-s">حضر</span>
          </div>
          <div style="font-size:10px;color:var(--gray-500);margin-bottom:2px;">${a.location||''}</div>
          <div style="font-size:10px;color:var(--gray-400);">${fmtDate(a.date)} — ${a.time||''}</div>
        </div>
      </div>
    </div>`).join('');
}

window.recordAtt = async function(){
  const sub = document.getElementById('att-sub')?.value||'';
  const loc = document.getElementById('att-loc')?.value||'';
  if(!sub) return;
  const now = new Date();
  const record = {
    subject:sub, location:loc,
    date: now.toISOString().split('T')[0],
    time: now.toTimeString().slice(0,5)
  };
  const btn = document.getElementById('att-btn');
  if(btn){ btn.disabled=true; btn.innerHTML='<span class="material-icons-round" style="font-size:20px;animation:spin .7s linear infinite;">refresh</span>جارٍ التسجيل...'; }
  try{
    const nid = await fsAdd('attendance',record);
    Cache.attendance.unshift({id:nid,...record});
  }catch(e){ Cache.attendance.unshift({id:uid(),...record}); }
  addActivity(`تم تسجيل حضور درس ${sub}`, 'fact_check', '#2563EB');
  if(btn){
    btn.disabled=false;
    btn.style.background='linear-gradient(135deg,#10B981,#059669)';
    btn.innerHTML='<span class="material-icons-round" style="font-size:20px;">check_circle</span>تم التسجيل!';
    setTimeout(()=>{ btn.style.background=''; btn.innerHTML='<span class="material-icons-round" style="font-size:20px;">check_circle</span>تم الوصول'; },2200);
  }
  const ll = document.getElementById('att-list');
  if(ll) ll.innerHTML = renderAttList(Cache.attendance);
  const phP = document.querySelector('#attpg .ph p');
  if(phP) phP.textContent = Cache.attendance.length+' سجل حضور';
};

async function pgParentOverview(){
  await Promise.all([loadAll('subjects'),loadAll('tasks'),loadAll('grades'),loadAll('attendance')]);
  const subs=Cache.subjects, tasks=Cache.tasks, grades=Cache.grades, att=Cache.attendance;
  const tp = subs.length?Math.round(subs.reduce((s,x)=>s+(x.progress||0),0)/subs.length):0;
  const done = tasks.filter(t=>t.status==='done').length;
  const failed = tasks.filter(t=>t.status==='failed').length;
  const avg = grades.length?Math.round(grades.reduce((s,g)=>s+gpct(g.grade,g.total),0)/grades.length):0;
  return `
  <div class="page-scroll" style="padding-bottom:calc(var(--nav)+18px);">
    <div class="ph" style="display:flex;align-items:center;gap:10px;">
      <button onclick="goHome()" style="background:var(--blue-glass);border:none;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;">
        <span class="material-icons-round" style="font-size:18px;color:var(--blue);transform:scaleX(-1);">arrow_back_ios</span>
      </button>
      <div><h1>لوحة المتابعة</h1><p>نظرة شاملة على الأداء</p></div>
    </div>
    <div class="cp">
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px;">
        <div class="glass card ai" style="background:linear-gradient(135deg,rgba(37,99,235,.85),rgba(29,78,216,.8));border:none;text-align:center;">
          <div style="font-size:34px;font-weight:900;color:white;letter-spacing:-2px;">${tp}%</div>
          <div style="font-size:10px;color:rgba(255,255,255,.7);margin-top:2px;">إجمالي التقدم</div>
        </div>
        <div class="glass card ai" style="background:linear-gradient(135deg,rgba(16,185,129,.85),rgba(5,150,105,.8));border:none;text-align:center;">
          <div style="font-size:34px;font-weight:900;color:white;letter-spacing:-2px;">${avg}%</div>
          <div style="font-size:10px;color:rgba(255,255,255,.7);margin-top:2px;">متوسط الدرجات</div>
        </div>
        <div class="stat-c ai"><div class="stat-v" style="color:var(--success);">${done}</div><div class="stat-l">مهام منجزة</div></div>
        <div class="stat-c ai"><div class="stat-v" style="color:var(--danger);">${failed}</div><div class="stat-l">مهام فاشلة</div></div>
        <div class="stat-c ai"><div class="stat-v" style="color:var(--blue);">${att.length}</div><div class="stat-l">حضور مسجل</div></div>
        <div class="stat-c ai"><div class="stat-v" style="color:var(--gray-700);">${subs.length}</div><div class="stat-l">مادة دراسية</div></div>
      </div>
      ${subs.length?`
      <div class="sec">تقدم المواد الدراسية</div>
      <div class="glass card ai" style="margin-bottom:12px;">
        ${subs.map((s,i)=>`
          <div style="margin-bottom:${i<subs.length-1?'12px':'0'};">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;">
              <div style="display:flex;align-items:center;gap:7px;">
                <span class="material-icons-round" style="font-size:15px;color:${s.color||subColor(s.name)};">${s.icon||'menu_book'}</span>
                <span style="font-size:12px;font-weight:700;">${s.name}</span>
              </div>
              <span style="font-size:12px;font-weight:800;color:${s.color||subColor(s.name)};">${s.progress||0}%</span>
            </div>
            <div class="pb"><div class="pf" data-w="${s.progress||0}" style="width:0;background:linear-gradient(90deg,${(s.color||subColor(s.name))}88,${s.color||subColor(s.name)});"></div></div>
          </div>`).join('')}
      </div>`:''}
      ${grades.length?`
      <div class="sec">آخر الدرجات</div>
      ${grades.slice(0,5).map(g=>{const p=gpct(g.grade,g.total);return`
        <div class="glass2 cardsm ai" style="margin-bottom:7px;">
          <div style="display:flex;align-items:center;gap:9px;">
            <div style="width:38px;height:38px;border-radius:10px;background:${gcol(p)}12;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:${gcol(p)};flex-shrink:0;">${p}%</div>
            <div style="flex:1;"><div style="font-size:11px;font-weight:700;">${g.exam||'—'}</div><span class="sj-tag ${subTag(g.subject)}">${g.subject||''}</span></div>
            <span style="font-size:14px;font-weight:800;color:${gcol(p)};">${g.grade}<span style="font-size:9px;color:var(--gray-400);">/${g.total}</span></span>
          </div>
        </div>`}).join('')}`:''}
    </div>
  </div>`;
}
